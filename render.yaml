services:
  # ── Backend API (Express + Node.js) ──────────────────────────────────────────
  - type: web
    name: herrise-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set in Render dashboard (Secret)
      - key: MONGODB_DB_NAME
        value: HerRise
      - key: GROQ_API_KEY
        sync: false          # Set in Render dashboard (Secret)
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard (Secret)
      - key: CLIENT_URL
        sync: false          # Set to your frontend Render URL after first deploy

  # ── Frontend (React + Vite) ────────────────────────────────────────────────
  - type: web
    name: herrise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false          # Set to your backend Render URL, e.g. https://herrise-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
